<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>To-Do List</h1>
    <div class="to-do-list">
        <div class="to-do-list-header">
            <input class="task-input" type="text" placeholder="Digite uma nova tarefa">
            <button class="btn-add-task" title="Clique aqui para adiconar uma nova tarefa"><i class="bi bi-plus-lg"></i></button>
        </div>
        <div class="to-do-list-body">
            <ul></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
